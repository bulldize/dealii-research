<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Giesekus · 实验观察台</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#dae4f0;background:#101821}body{max-width:1200px;margin:0 auto;padding:32px 22px}h1{font-size:30px;margin:8px 0}h2{font-size:18px}small,.muted{color:#99aebe}.tag{color:#64d2b3;font-size:12px;letter-spacing:2px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.card,.panel{background:#192531;border:1px solid #304252;border-radius:14px;padding:20px}.value{font-size:28px;margin-top:10px}.panel{margin-bottom:18px}#phase{font-size:19px;overflow-wrap:anywhere}progress{width:100%;height:10px;accent-color:#64d2b3}button,select{background:#233644;color:#e4edf5;border:1px solid #496071;border-radius:6px;padding:8px}th{position:sticky;top:0;background:#192531}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;border-bottom:1px solid #304252;padding:11px 8px;white-space:nowrap}.scroll{overflow:auto;max-height:480px}pre{font:12px/1.6 monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:350px;overflow:auto;color:#b9cbd9}.good{color:#64d2b3}.bad{color:#ffb098}#connection{font-size:13px}.note{font-size:13px;line-height:1.8}.running{color:#88c7ff}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}body{padding:20px 12px}.top{align-items:flex-start;flex-direction:column}.value{font-size:22px}}
</style>
<div class="top"><div><div class="tag">DEAL.II / GIESEKUS</div><h1>实验观察台</h1><span class="muted">完整论文实验 · 只读监控</span></div><div id="connection">正在连接…</div></div>
<div class="cards"><div class="card"><small>已完成实验</small><div id="done" class="value">—</div></div><div class="card"><small>运行 / 失败 / 未完成</small><div id="counts" class="value">—</div></div><div class="card"><small>CPU · 全机利用率</small><div id="cpu" class="value">—</div></div><div class="card"><small>内存 · 已用 / 总量</small><div id="memory" class="value">—</div></div></div>
<div class="panel"><small>最新阶段记录</small><p id="phase">—</p><progress id="progress" value="0" max="66"></progress><p id="process" class="note"></p><div id="extra" class="note muted"></div></div>
<div class="panel"><div class="top"><h2>实验清单</h2><select id="filter"><option value="all">全部实验</option><option value="running">运行中</option><option value="failed">失败</option><option value="incomplete">未完成 / 待检查</option><option value="completed">已完成</option><option value="pending">未开始</option></select></div><div class="scroll"><table><thead><tr><th>实验</th><th>状态</th><th>时间步</th><th>物理时间</th><th>Newton 迭代</th><th>最小 det F</th><th>日志</th></tr></thead><tbody id="cases"></tbody></table></div></div>
<div class="panel"><div class="top"><h2>最近日志</h2><select id="log"><option value="pipeline">总流程</option><option value="dealii-configure">deal.II 配置</option><option value="dealii-build">deal.II 编译</option><option value="research-build">算法库编译与测试</option><option value="calibration">性能测量</option><option value="convergence">收敛实验</option><option value="contraction">收缩流实验</option><option value="plotting">绘图</option></select></div><pre id="logtext">加载中…</pre></div>
<p class="note muted">每 5 秒刷新。完成表示程序完成该算例，不等于论文结论已验证。无存活进程的部分结果标为“未完成”，不会误报运行中。当前算法不使用 GPU。页面不提供启动、停止或修改实验的操作。</p>
<script>
const $=id=>document.getElementById(id),token=new URLSearchParams(location.search).get('token'),labels={completed:'已完成',running:'运行中',failed:'失败',incomplete:'未完成 / 待检查',pending:'未开始'};let data;
async function request(path){const r=await fetch(path,{headers:token?{Authorization:'Bearer '+token}:{},signal:AbortSignal.timeout(10000)});if(!r.ok)throw Error('HTTP '+r.status);return r}
const gib=n=>Number.isFinite(n)?(n/2**30).toFixed(1)+' GiB':'—';
function render(){if(!data)return;const body=$('cases');body.replaceChildren();for(const c of data.cases){if($('filter').value!=='all'&&$('filter').value!==c.state)continue;const tr=document.createElement('tr'),h=c.history;for(const v of [c.name,labels[c.state],`${h.step??'—'} / ${c.steps}`,h.time??'—',h.newton_iterations??'—',h.min_det_F??'—']){const td=document.createElement('td');td.textContent=v;tr.append(td)}tr.children[1].className=c.state==='completed'?'good':c.state==='failed'?'bad':c.state==='running'?'running':'';const td=document.createElement('td'),b=document.createElement('button');b.textContent='查看';b.onclick=()=>{if(!Array.from($('log').options).some(o=>o.value===c.name))$('log').add(new Option(c.name,c.name));$('log').value=c.name;loadLog()};td.append(b);tr.append(td);body.append(tr)}}
async function loadLog(){try{$('logtext').textContent=await(await request('/api/log?name='+encodeURIComponent($('log').value))).text()||'尚无日志'}catch(e){$('logtext').textContent='日志读取失败：'+e.message}}
async function update(){try{data=await(await request('/api/status')).json();const count=s=>data.cases.filter(c=>c.state===s).length,r=data.resources,m=r.memory;$('done').textContent=count('completed')+' / '+data.cases.length;$('counts').textContent=[count('running'),count('failed'),count('incomplete')].join(' / ');$('cpu').textContent=r.cpu_percent===null?(data.process_detection?'采样中':'此主机不支持'):r.cpu_percent+'%';$('memory').textContent=gib(m.used)+' / '+gib(m.total);$('phase').textContent=data.phase;$('progress').max=data.cases.length;$('progress').value=count('completed');$('process').textContent=!data.process_detection?'此主机不支持 Linux 进程检测':data.pipeline_alive?'主流程进程存活':'未检测到原主流程进程；请结合阶段和日志判断是否完成、停止或由其他流程接管';$('extra').textContent=`磁盘剩余 ${gib(r.disk_free)} · 交换内存 ${gib(m.swap_used)} · ${r.logical_cpus} 个逻辑 CPU · 阶段记录时间 ${data.phase_updated?new Date(data.phase_updated*1000).toLocaleString():'未知'}`;$('connection').textContent='● 已更新 '+new Date(data.time*1000).toLocaleTimeString();$('connection').className='good';render();await loadLog()}catch(e){$('connection').textContent='连接失败，显示的是旧数据：'+e.message;$('connection').className='bad'}finally{setTimeout(update,5000)}}
$('filter').onchange=render;$('log').onchange=loadLog;update();
</script></html>
